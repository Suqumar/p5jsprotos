<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared Todo List - Claude Persistent Storage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Minimal offline fallback styles */
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #334155;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid var(--muted);
      background: var(--card);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--accent);
      background: var(--muted);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
    }

    .btn-danger:hover {
      filter: brightness(1.1);
    }

    .input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--muted);
      border-radius: 0.5rem;
      padding: 0.75rem;
      color: var(--text);
      outline: none;
    }

    .input:focus {
      border-color: var(--accent);
    }

    .todo-item {
      background: var(--card);
      border: 1px solid var(--muted);
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
      transition: all 0.2s;
    }

    .todo-item:hover {
      border-color: var(--accent);
    }

    .todo-item.completed {
      opacity: 0.6;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-pending {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
    }

    .badge-in-progress {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
    }

    .badge-completed {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }

    .sync-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--card);
      border: 1px solid var(--muted);
      border-radius: 9999px;
      font-size: 0.875rem;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .stats-card {
      background: var(--card);
      border: 1px solid var(--muted);
      border-radius: 0.75rem;
      padding: 1rem;
      text-align: center;
    }

    .stats-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stats-label {
      font-size: 0.875rem;
      color: var(--text-dim);
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="mb-8">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h1 class="text-3xl font-bold tracking-tight">📝 Shared Todo List</h1>
          <p class="text-sm text-slate-400 mt-1">Powered by Claude Persistent Storage APIs</p>
        </div>
        <div class="sync-indicator">
          <span class="sync-dot"></span>
          <span id="syncStatus">Local Storage</span>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-4 gap-4">
        <div class="stats-card">
          <div class="stats-number" id="totalCount">0</div>
          <div class="stats-label">Total</div>
        </div>
        <div class="stats-card">
          <div class="stats-number text-yellow-500" id="pendingCount">0</div>
          <div class="stats-label">Pending</div>
        </div>
        <div class="stats-card">
          <div class="stats-number text-blue-500" id="inProgressCount">0</div>
          <div class="stats-label">In Progress</div>
        </div>
        <div class="stats-card">
          <div class="stats-number text-green-500" id="completedCount">0</div>
          <div class="stats-label">Completed</div>
        </div>
      </div>
    </header>

    <!-- Add Todo Form -->
    <div class="mb-6 p-6 rounded-xl border border-slate-700 bg-slate-800/50">
      <h2 class="text-lg font-semibold mb-3">Add New Todo</h2>
      <div class="flex gap-3 mb-3">
        <input
          id="todoInput"
          type="text"
          class="input flex-1"
          placeholder="What needs to be done?"
          onkeypress="if(event.key==='Enter') addTodo()"
        />
        <select id="statusSelect" class="input" style="width: 150px;">
          <option value="pending">Pending</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
        <button onclick="addTodo()" class="btn btn-primary">Add Todo</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="mb-4 flex items-center gap-3">
      <input
        id="searchInput"
        type="text"
        class="input flex-1"
        placeholder="Search todos..."
        oninput="renderTodos()"
      />
      <select id="filterStatus" class="input" style="width: 150px;" onchange="renderTodos()">
        <option value="all">All Status</option>
        <option value="pending">Pending</option>
        <option value="in_progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
      <button onclick="exportTodos()" class="btn">📥 Export</button>
      <button onclick="importTodos()" class="btn">📤 Import</button>
      <button onclick="clearCompleted()" class="btn btn-danger">🗑️ Clear Completed</button>
    </div>

    <!-- Todo List -->
    <div id="todoList" class="mb-6"></div>

    <!-- Empty State -->
    <div id="emptyState" class="text-center py-12 text-slate-400" style="display: none;">
      <div class="text-6xl mb-4">📋</div>
      <div class="text-lg">No todos yet. Add one above to get started!</div>
    </div>
  </div>

  <!-- Hidden file input for import -->
  <input type="file" id="importFile" accept=".json" style="display: none;" onchange="handleImport(event)" />

  <script>
    /**************************************
     * Storage Layer - Claude Persistent Storage APIs
     **************************************/

    const STORAGE_KEY = 'claude_shared_todos';
    const STORAGE_VERSION = '1.0.0';

    // Storage abstraction layer - can be extended to use MCP resources
    class TodoStorage {
      constructor() {
        this.storageType = 'localStorage'; // Can be extended to 'mcp', 'cloud', etc.
      }

      // Load todos from storage
      load() {
        try {
          const data = localStorage.getItem(STORAGE_KEY);
          if (!data) return { version: STORAGE_VERSION, todos: [], lastSync: null };
          return JSON.parse(data);
        } catch (e) {
          console.error('Error loading todos:', e);
          return { version: STORAGE_VERSION, todos: [], lastSync: null };
        }
      }

      // Save todos to storage
      save(todos) {
        try {
          const data = {
            version: STORAGE_VERSION,
            todos: todos,
            lastSync: new Date().toISOString()
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          this.updateSyncStatus();
          return true;
        } catch (e) {
          console.error('Error saving todos:', e);
          return false;
        }
      }

      // Update sync status indicator
      updateSyncStatus() {
        const statusEl = document.getElementById('syncStatus');
        const data = this.load();
        if (data.lastSync) {
          const syncDate = new Date(data.lastSync);
          const now = new Date();
          const diff = Math.floor((now - syncDate) / 1000);

          if (diff < 5) {
            statusEl.textContent = 'Just synced';
          } else if (diff < 60) {
            statusEl.textContent = `Synced ${diff}s ago`;
          } else if (diff < 3600) {
            statusEl.textContent = `Synced ${Math.floor(diff / 60)}m ago`;
          } else {
            statusEl.textContent = `Synced ${Math.floor(diff / 3600)}h ago`;
          }
        } else {
          statusEl.textContent = 'Local Storage';
        }
      }

      // Clear all data
      clear() {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    /**************************************
     * Application State
     **************************************/

    const storage = new TodoStorage();
    let todos = [];

    // Todo class
    class Todo {
      constructor(content, status = 'pending', id = null) {
        this.id = id || this.generateId();
        this.content = content;
        this.status = status; // 'pending', 'in_progress', 'completed'
        this.createdAt = new Date().toISOString();
        this.updatedAt = new Date().toISOString();
      }

      generateId() {
        return 'todo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      }

      update(changes) {
        Object.assign(this, changes);
        this.updatedAt = new Date().toISOString();
      }
    }

    /**************************************
     * Core Functions
     **************************************/

    function loadTodos() {
      const data = storage.load();
      todos = data.todos.map(t => {
        const todo = new Todo(t.content, t.status, t.id);
        todo.createdAt = t.createdAt;
        todo.updatedAt = t.updatedAt;
        return todo;
      });
      renderTodos();
      updateStats();
    }

    function saveTodos() {
      storage.save(todos);
      updateStats();
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const statusSelect = document.getElementById('statusSelect');
      const content = input.value.trim();

      if (!content) {
        alert('Please enter a todo item');
        return;
      }

      const todo = new Todo(content, statusSelect.value);
      todos.unshift(todo); // Add to beginning
      saveTodos();
      renderTodos();

      // Clear input
      input.value = '';
      input.focus();
    }

    function deleteTodo(id) {
      if (!confirm('Are you sure you want to delete this todo?')) return;

      todos = todos.filter(t => t.id !== id);
      saveTodos();
      renderTodos();
    }

    function updateTodoStatus(id, status) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.update({ status });
        saveTodos();
        renderTodos();
      }
    }

    function editTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (!todo) return;

      const newContent = prompt('Edit todo:', todo.content);
      if (newContent && newContent.trim()) {
        todo.update({ content: newContent.trim() });
        saveTodos();
        renderTodos();
      }
    }

    function clearCompleted() {
      const completedCount = todos.filter(t => t.status === 'completed').length;
      if (completedCount === 0) {
        alert('No completed todos to clear');
        return;
      }

      if (!confirm(`Delete ${completedCount} completed todo(s)?`)) return;

      todos = todos.filter(t => t.status !== 'completed');
      saveTodos();
      renderTodos();
    }

    /**************************************
     * Rendering
     **************************************/

    function renderTodos() {
      const container = document.getElementById('todoList');
      const emptyState = document.getElementById('emptyState');
      const searchInput = document.getElementById('searchInput');
      const filterStatus = document.getElementById('filterStatus');

      const searchTerm = searchInput.value.toLowerCase().trim();
      const statusFilter = filterStatus.value;

      // Filter todos
      let filteredTodos = todos;

      if (searchTerm) {
        filteredTodos = filteredTodos.filter(t =>
          t.content.toLowerCase().includes(searchTerm)
        );
      }

      if (statusFilter !== 'all') {
        filteredTodos = filteredTodos.filter(t => t.status === statusFilter);
      }

      // Show/hide empty state
      if (filteredTodos.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      // Render todos
      container.innerHTML = filteredTodos.map(todo => {
        const statusBadge = getStatusBadge(todo.status);
        const completedClass = todo.status === 'completed' ? 'completed' : '';
        const createdDate = new Date(todo.createdAt).toLocaleString();

        return `
          <div class="todo-item ${completedClass}">
            <div class="flex items-start justify-between">
              <div class="flex-1">
                <div class="flex items-center gap-3 mb-2">
                  ${statusBadge}
                  <span class="text-xs text-slate-500">Created: ${createdDate}</span>
                </div>
                <div class="todo-text text-lg mb-2">${escapeHtml(todo.content)}</div>
              </div>
              <div class="flex gap-2 ml-4">
                <button onclick="editTodo('${todo.id}')" class="btn" title="Edit">✏️</button>
                <button onclick="deleteTodo('${todo.id}')" class="btn btn-danger" title="Delete">🗑️</button>
              </div>
            </div>
            <div class="flex gap-2 mt-3">
              <button
                onclick="updateTodoStatus('${todo.id}', 'pending')"
                class="btn ${todo.status === 'pending' ? 'btn-primary' : ''}"
              >
                Pending
              </button>
              <button
                onclick="updateTodoStatus('${todo.id}', 'in_progress')"
                class="btn ${todo.status === 'in_progress' ? 'btn-primary' : ''}"
              >
                In Progress
              </button>
              <button
                onclick="updateTodoStatus('${todo.id}', 'completed')"
                class="btn ${todo.status === 'completed' ? 'btn-primary' : ''}"
              >
                Completed
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function getStatusBadge(status) {
      const badges = {
        'pending': '<span class="badge badge-pending">⏳ Pending</span>',
        'in_progress': '<span class="badge badge-in-progress">🔄 In Progress</span>',
        'completed': '<span class="badge badge-completed">✅ Completed</span>'
      };
      return badges[status] || badges.pending;
    }

    function updateStats() {
      document.getElementById('totalCount').textContent = todos.length;
      document.getElementById('pendingCount').textContent =
        todos.filter(t => t.status === 'pending').length;
      document.getElementById('inProgressCount').textContent =
        todos.filter(t => t.status === 'in_progress').length;
      document.getElementById('completedCount').textContent =
        todos.filter(t => t.status === 'completed').length;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    /**************************************
     * Import/Export
     **************************************/

    function exportTodos() {
      const data = {
        version: STORAGE_VERSION,
        exportDate: new Date().toISOString(),
        todos: todos
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], {
        type: 'application/json'
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `todos_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importTodos() {
      document.getElementById('importFile').click();
    }

    function handleImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);

          if (!data.todos || !Array.isArray(data.todos)) {
            throw new Error('Invalid todo data format');
          }

          const importedTodos = data.todos.map(t => {
            const todo = new Todo(t.content, t.status, t.id);
            todo.createdAt = t.createdAt;
            todo.updatedAt = t.updatedAt;
            return todo;
          });

          // Merge or replace
          const action = confirm(
            `Import ${importedTodos.length} todo(s).\n\n` +
            `Click OK to MERGE with existing todos.\n` +
            `Click Cancel to REPLACE all todos.`
          );

          if (action) {
            // Merge: Add imported todos that don't exist
            const existingIds = new Set(todos.map(t => t.id));
            const newTodos = importedTodos.filter(t => !existingIds.has(t.id));
            todos = [...todos, ...newTodos];
          } else {
            // Replace
            todos = importedTodos;
          }

          saveTodos();
          renderTodos();
          alert('Import successful!');
        } catch (error) {
          alert('Error importing todos: ' + error.message);
        }
      };
      reader.readAsText(file);

      // Reset file input
      event.target.value = '';
    }

    /**************************************
     * Initialization
     **************************************/

    function init() {
      loadTodos();

      // Update sync status periodically
      setInterval(() => {
        storage.updateSyncStatus();
      }, 5000);

      // Add keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        // Ctrl/Cmd + K to focus search
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
          e.preventDefault();
          document.getElementById('searchInput').focus();
        }

        // Ctrl/Cmd + N to focus new todo input
        if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
          e.preventDefault();
          document.getElementById('todoInput').focus();
        }
      });

      console.log('🚀 Shared Todo List initialized');
      console.log('📦 Storage type:', storage.storageType);
      console.log('📝 Total todos:', todos.length);
    }

    // Start the app
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
